# Verify the claims, rebuild the site from the fresh results, publish to GitHub Pages.
# The deploy is gated on the evaluation: if the pipeline stops reproducing the numbers in
# README.md, tools/check_results.py fails and nothing is published.
name: verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: unit tests
        run: python3 -m unittest discover -s tests -v

      - name: rebuild the 12 cases from source
        run: python3 eval/build_cases.py

      - name: baselines, pipeline and ablations
        run: python3 eval/run_eval.py --ablations

      - name: check every claim the README makes
        run: python3 tools/check_results.py

      - name: pack the site
        run: |
          python3 tools/build_site.py
          python3 tools/build_artifact.py

      - name: the browser driver reproduces the recorded packets
        run: python3 tools/test_browser_driver.py

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            results/
            trajectories/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
